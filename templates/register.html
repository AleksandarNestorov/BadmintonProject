<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">🏸 Обратно към Начало</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>📝 Създай нов профил</h3>
                </div>
                <div class="card-body">
                    
                    <form method="POST">
                        {% csrf_token %} {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }} {% if field.help_text %}
                                <small class="form-text text-muted">{{ field.help_text }}</small>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                        {% endfor %}
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Регистрация</button>
                        </div>
                    </form>

                </div>
                <div class="card-footer text-center">
                    <small>Вече имаш акаунт? <a href="{% url 'login' %}">Влез тук</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var inputs = document.querySelectorAll('input');
    inputs.forEach(function(input) {
        input.classList.add('form-control');
    });

    var selects = document.querySelectorAll('select');
    selects.forEach(function(select) {
        select.classList.add('form-select');
    });

    var countrySelect = document.getElementById('id_phone_country');
    var phoneInput = document.getElementById('id_phone');

    if (countrySelect && phoneInput) {
        var rules = {};
        countrySelect.dataset.phoneRules.split('|').forEach(function(item) {
            var parts = item.split(':');
            rules[parts[0]] = {
                prefix: parts[1],
                digits: parts[2],
                example: parts[3]
            };
        });

        function updatePhoneHint() {
            var rule = rules[countrySelect.value];
            if (!rule) return;
            phoneInput.placeholder = rule.example;

            var helpText = phoneInput.closest('.mb-3').querySelector('.form-text');
            if (helpText) {
                helpText.textContent = 'Въведете ' + rule.digits + ' цифри след ' + rule.prefix + ', например ' + rule.example + '.';
            }
        }

        countrySelect.addEventListener('change', updatePhoneHint);
        updatePhoneHint();
    }
</script>

</body>
</html>
