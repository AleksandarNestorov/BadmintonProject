<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/site-ui.css' %}" rel="stylesheet">
</head>
<body class="app-page">

<nav class="navbar navbar-dark site-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <span class="brand-mark"></span>
            <span>Бадминтон зала Юнак</span>
        </a>
    </div>
</nav>

<div class="container page-shell register-shell">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card app-card">
                <div class="app-card-header text-center">
                    <h3 class="app-card-title">Създай нов профил</h3>
                </div>
                <div class="card-body">
                    <form method="post" id="registerForm" novalidate>
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <small class="form-text text-muted">{{ field.help_text }}</small>
                                {% endif %}
                                {% for error in field.errors %}
                                    <div class="text-danger small">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-brand btn-lg">Регистрация</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer app-card-footer text-center">
                    <small>Вече имаш акаунт? <a href="{% url 'login' %}" class="site-link">Влез тук</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('input');
    inputs.forEach(function(input) {
        input.classList.add('form-control');
    });

    const selects = document.querySelectorAll('select');
    selects.forEach(function(select) {
        select.classList.add('form-select');
    });

    const countrySelect = document.getElementById('id_phone_country');
    const phoneInput = document.getElementById('id_phone');
    const registerForm = document.getElementById('registerForm');

    function getFeedbackElement(input) {
        const fieldWrapper = input.closest('.mb-3');
        let feedback = fieldWrapper.querySelector('.client-invalid-feedback');

        if (!feedback) {
            feedback = document.createElement('div');
            feedback.className = 'invalid-feedback client-invalid-feedback';
            fieldWrapper.appendChild(feedback);
        }

        return feedback;
    }

    function setRegisterFieldState(input, isValid, message) {
        const feedback = getFeedbackElement(input);
        feedback.textContent = message || '';
        input.classList.toggle('is-invalid', !isValid);
        input.classList.toggle('is-valid', isValid && input.value.trim().length > 0);
    }

    function validateRequired(input, message) {
        const isValid = input.value.trim().length > 0;
        setRegisterFieldState(input, isValid, message);
        return isValid;
    }

    function validateName(input, message) {
        const value = input.value.trim();
        const isValid = value.length >= 2;
        setRegisterFieldState(input, isValid, message);
        return isValid;
    }

    function validateUsername(input) {
        const value = input.value.trim();
        const isValid = /^[A-Za-z0-9_@.+-]{3,150}$/.test(value);
        setRegisterFieldState(input, isValid, 'Потребителското име трябва да е поне 3 символа и да съдържа само латински букви, цифри и стандартни символи.');
        return isValid;
    }

    function validateEmail(input) {
        const value = input.value.trim();
        const isLatinOnly = /^[A-Za-z0-9._%+\-@]+$/.test(value);
        const hasValidFormat = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(value);
        const isValid = isLatinOnly && hasValidFormat;
        setRegisterFieldState(input, isValid, 'Имейлът трябва да бъде валиден и изписан с латински букви.');
        return isValid;
    }

    function validatePhone() {
        if (!countrySelect || !phoneInput) return true;

        const rule = rules[countrySelect.value];
        if (!rule) return true;

        let digits = phoneInput.value.replace(/\D/g, '');
        const prefixDigits = rule.prefix.replace(/\D/g, '');

        if (digits.indexOf(prefixDigits) === 0) {
            digits = digits.slice(prefixDigits.length);
        }

        const isValid = digits.length === Number(rule.digits);
        setRegisterFieldState(
            phoneInput,
            isValid,
            'Телефонът трябва да съдържа точно ' + rule.digits + ' цифри след ' + rule.prefix + '.'
        );
        return isValid;
    }

    function validatePassword(passwordInput) {
        const isValid = passwordInput.value.length >= 8;
        setRegisterFieldState(passwordInput, isValid, 'Паролата трябва да съдържа поне 8 символа.');
        return isValid;
    }

    function validatePasswordMatch(passwordInput, confirmInput) {
        const isValid = confirmInput.value.length > 0 && confirmInput.value === passwordInput.value;
        setRegisterFieldState(confirmInput, isValid, 'Двете пароли трябва да съвпадат.');
        return isValid;
    }

    let rules = {};
    if (countrySelect && phoneInput) {
        countrySelect.dataset.phoneRules.split('|').forEach(function(item) {
            const parts = item.split(':');
            rules[parts[0]] = {
                prefix: parts[1],
                digits: parts[2],
                example: parts[3]
            };
        });

        function updatePhoneHint() {
            const rule = rules[countrySelect.value];
            if (!rule) return;
            phoneInput.placeholder = rule.example;

            const helpText = phoneInput.closest('.mb-3').querySelector('.form-text');
            if (helpText) {
                helpText.textContent = 'Въведете ' + rule.digits + ' цифри след ' + rule.prefix + ', например ' + rule.example + '.';
            }
        }

        countrySelect.addEventListener('change', updatePhoneHint);
        countrySelect.addEventListener('change', validatePhone);
        phoneInput.addEventListener('input', validatePhone);
        updatePhoneHint();
    }

    if (registerForm) {
        const usernameInput = registerForm.querySelector('[name="username"]');
        const firstNameInput = registerForm.querySelector('[name="first_name"]');
        const lastNameInput = registerForm.querySelector('[name="last_name"]');
        const genderInput = registerForm.querySelector('[name="gender"]');
        const emailInput = registerForm.querySelector('[name="email"]');
        const passwordInput = registerForm.querySelector('[name="password1"]');
        const confirmInput = registerForm.querySelector('[name="password2"]');

        registerForm.addEventListener('submit', function(event) {
            let isValid = true;

            if (usernameInput) isValid = validateUsername(usernameInput) && isValid;
            if (firstNameInput) isValid = validateName(firstNameInput, 'Моля, въведете име с поне 2 символа.') && isValid;
            if (lastNameInput) isValid = validateName(lastNameInput, 'Моля, въведете фамилия с поне 2 символа.') && isValid;
            if (genderInput) isValid = validateRequired(genderInput, 'Моля, изберете пол.') && isValid;
            if (emailInput) isValid = validateEmail(emailInput) && isValid;
            if (phoneInput) isValid = validatePhone() && isValid;
            if (passwordInput) isValid = validatePassword(passwordInput) && isValid;
            if (passwordInput && confirmInput) isValid = validatePasswordMatch(passwordInput, confirmInput) && isValid;

            if (!isValid) {
                event.preventDefault();
                event.stopPropagation();
            }
        });

        if (usernameInput) usernameInput.addEventListener('input', function() { validateUsername(usernameInput); });
        if (firstNameInput) firstNameInput.addEventListener('input', function() { validateName(firstNameInput, 'Моля, въведете име с поне 2 символа.'); });
        if (lastNameInput) lastNameInput.addEventListener('input', function() { validateName(lastNameInput, 'Моля, въведете фамилия с поне 2 символа.'); });
        if (genderInput) genderInput.addEventListener('change', function() { validateRequired(genderInput, 'Моля, изберете пол.'); });
        if (emailInput) emailInput.addEventListener('input', function() { validateEmail(emailInput); });
        if (passwordInput) passwordInput.addEventListener('input', function() {
            validatePassword(passwordInput);
            if (confirmInput && confirmInput.value) validatePasswordMatch(passwordInput, confirmInput);
        });
        if (confirmInput) confirmInput.addEventListener('input', function() { validatePasswordMatch(passwordInput, confirmInput); });
    }
</script>

</body>
</html>
