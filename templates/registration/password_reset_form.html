<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забравена парола</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/site-ui.css' %}" rel="stylesheet">
</head>
<body class="app-page">

<nav class="navbar navbar-dark site-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <span class="brand-mark"></span>
            <span>Бадминтон зала Юнак</span>
        </a>
    </div>
</nav>

<div class="container page-shell auth-shell">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card app-card">
                <div class="app-card-header text-center">
                    <h3 class="app-card-title">Възстановяване на парола</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4">
                        Въведете имейла на своя акаунт и ще изпратим линк за задаване на нова парола.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">Имейл адрес</label>
                            {{ form.email }}
                            {% if form.email.errors %}
                                <div class="text-danger small mt-1">{{ form.email.errors|join:", " }}</div>
                            {% endif %}
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-brand btn-lg">Изпрати линк</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer app-card-footer text-center">
                    <small><a href="{% url 'login' %}" class="site-link">Назад към вход</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(function(input) {
        input.classList.add('form-control');
    });
</script>

</body>
</html>
