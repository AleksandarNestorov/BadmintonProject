<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изпратен имейл</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/site-ui.css' %}" rel="stylesheet">
</head>
<body class="app-page">

<nav class="navbar navbar-dark site-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <span class="brand-mark"></span>
            <span>Бадминтон зала Юнак</span>
        </a>
    </div>
</nav>

<div class="container page-shell auth-shell">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card app-card">
                <div class="app-card-header text-center">
                    <h3 class="app-card-title">Провери своя имейл</h3>
                </div>
                <div class="card-body text-center">
                    <p class="mb-3">
                        Ако има акаунт с този имейл, изпратихме линк за смяна на паролата.
                    </p>
                    <p class="text-muted mb-0">
                        Провери входящата поща и spam папката, ако не виждаш съобщението веднага.
                    </p>
                </div>
                <div class="card-footer app-card-footer text-center">
                    <small><a href="{% url 'login' %}" class="site-link">Назад към вход</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
