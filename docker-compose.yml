services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: badminton_db
      POSTGRES_USER: badminton_user
      POSTGRES_PASSWORD: badminton_pass
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton_user -d badminton_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: badminton_db
      POSTGRES_USER: badminton_user
      POSTGRES_PASSWORD: badminton_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
